<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crisis Support Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Fredoka', cursive, sans-serif; 
            user-select: none;
        }

        /* 3D Cartoon Capsule Buttons */
        .btn-cartoon {
            background: linear-gradient(180deg, #ffd000 0%, #ff8800 100%);
            border: 4px solid #5c2300;
            box-shadow: inset 0px 4px 0px #ffeaa7, 0px 6px 0px #3d1700;
            color: #ffffff;
            text-shadow: -2px -2px 0 #5c2300, 2px -2px 0 #5c2300, -2px 2px 0 #5c2300, 2px 2px 0 #5c2300, 0px 3px 0 #3d1700;
            border-radius: 28px;
            transition: all 0.1s ease;
            cursor: pointer;
        }

        .btn-cartoon:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }

        .btn-cartoon:active {
            transform: translateY(4px);
            box-shadow: inset 0px 2px 0px #ffeaa7, 0px 2px 0px #3d1700;
        }

        .btn-cartoon-green {
            background: linear-gradient(180deg, #7cfc00 0%, #32cd32 100%);
            border: 4px solid #145214;
            box-shadow: inset 0px 4px 0px #b3ffb3, 0px 6px 0px #0e380e;
            color: #ffffff;
            text-shadow: -2px -2px 0 #145214, 2px -2px 0 #145214, -2px 2px 0 #145214, 2px 2px 0 #145214, 0px 3px 0 #0e380e;
            border-radius: 28px;
            cursor: pointer;
        }

        .btn-cartoon-red {
            background: linear-gradient(180deg, #ff4d4d 0%, #cc0000 100%);
            border: 4px solid #4a0000;
            box-shadow: inset 0px 4px 0px #ffb3b3, 0px 6px 0px #300000;
            color: #ffffff;
            text-shadow: -2px -2px 0 #4a0000, 2px -2px 0 #4a0000, -2px 2px 0 #4a0000, 2px 2px 0 #4a0000;
            border-radius: 28px;
            cursor: pointer;
        }

        /* Cartoon Text Outlines */
        .title-cartoon {
            color: #ffcc00;
            text-shadow: 
                -3px -3px 0 #5c2300, 3px -3px 0 #5c2300, -3px 3px 0 #5c2300, 3px 3px 0 #5c2300,
                -4px 0px 0 #5c2300, 4px 0px 0 #5c2300, 0px -4px 0 #5c2300, 0px 6px 0 #3d1700;
        }

        .chat-bg { background-color: #fef08a; }
        .bubble-user { background-color: #3b82f6; color: white; border: 3px solid #1d4ed8; }
        .bubble-persona { background-color: #ffffff; color: #1e293b; border: 3px solid #000; }

        .tutorial-highlight {
            outline: 5px solid #ff0055;
            animation: pulse-border 0.8s infinite alternate;
        }

        @keyframes pulse-border {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
    </style>
</head>
<body class="bg-emerald-800 text-slate-900 min-h-screen flex flex-col items-center justify-center p-2 sm:p-4">

    <!-- MAIN MENU SCREEN -->
    <div id="main-menu" class="w-full max-w-md bg-cover bg-center rounded-3xl border-8 border-[#5c2300] shadow-[0px_12px_0px_0px_rgba(0,0,0,0.4)] flex flex-col items-center justify-between h-[680px] p-6 text-center relative overflow-hidden" style="background-image: linear-gradient(to bottom, #7dd3fc, #bae6fd 50%, #86efac 50%, #4ade80);">
        
        <!-- Sun & Clouds Background Elements -->
        <div class="absolute top-4 right-6 w-20 h-20 bg-amber-300 rounded-full border-4 border-[#5c2300] shadow-inner"></div>
        <div class="absolute top-10 left-4 w-28 h-10 bg-white rounded-full border-4 border-[#5c2300]"></div>

        <!-- Title Header -->
        <div class="mt-8 z-10">
            <h1 class="text-4xl font-black tracking-wide title-cartoon leading-tight">
                CRISIS<br>SUPPORT
            </h1>
            <div class="bg-[#ffaa00] border-4 border-[#5c2300] text-white font-extrabold px-6 py-1 rounded-full text-sm inline-block shadow-[0px_4px_0px_#5c2300] mt-1">
                SIMULATOR
            </div>
        </div>

        <!-- Menu Buttons -->
        <div class="z-10 w-full max-w-xs space-y-3 mb-6">
            <button id="play-btn" onclick="startGameFromMenu()" class="btn-cartoon w-full py-3.5 text-2xl font-black tracking-wider uppercase">
                PLAY
            </button>

            <button id="tutorial-btn" onclick="startTutorial()" class="btn-cartoon w-full py-3.5 text-2xl font-black tracking-wider uppercase">
                TUTORIAL
            </button>

            <button onclick="alert('Game Created by Jarrar!')" class="btn-cartoon w-full py-3.5 text-2xl font-black tracking-wider uppercase">
                CREDITS
            </button>
        </div>

        <div class="z-10">
            <span class="text-xs font-black text-[#5c2300] bg-white/80 px-3 py-1 rounded-full border-2 border-[#5c2300]">Made by Jarrar 🔥</span>
        </div>
    </div>

    <!-- GAME INTERFACE SCREEN -->
    <div id="game-screen" class="hidden relative w-full max-w-md bg-white rounded-3xl border-8 border-[#5c2300] shadow-[0px_12px_0px_0px_rgba(0,0,0,0.4)] flex flex-col h-[680px] overflow-hidden">
        
        <!-- Header -->
        <div class="p-3 bg-amber-400 border-b-4 border-[#5c2300] flex justify-between items-center z-10">
            <div class="flex items-center gap-2">
                <button onclick="pauseGame()" class="btn-cartoon px-3 py-1 text-xs font-black">
                    PAUSE
                </button>
                <div class="relative">
                    <img id="header-avatar" src="" class="w-10 h-10 rounded-full bg-white border-2 border-[#5c2300]">
                </div>
                <div>
                    <h1 class="font-extrabold text-sm text-black flex items-center gap-1" id="persona-name">Name</h1>
                    <p class="text-[10px] text-amber-900 font-extrabold" id="persona-status">Online</p>
                </div>
            </div>

            <!-- Timer & Meters -->
            <div class="flex flex-col items-end gap-1 relative">
                <div id="timer-box" class="text-xs font-black text-white bg-[#5c2300] px-2.5 py-0.5 rounded-full border-2 border-black">
                    ⏱️ <span id="timer-display">05:00</span>
                </div>
                <div class="flex gap-2">
                    <div class="text-right">
                        <span class="text-[9px] font-black text-black block">Sadness 😭</span>
                        <div class="w-16 bg-gray-200 h-3 rounded-full overflow-hidden border-2 border-[#5c2300]">
                            <div id="distress-bar" class="bg-red-500 h-full w-[80%] transition-all duration-500"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mode & Character Selectors -->
        <div id="mode-bar" class="p-2 bg-amber-100 border-b-4 border-[#5c2300] flex flex-col gap-2 z-10">
            <div class="flex gap-1 bg-white p-1 rounded-xl border-2 border-[#5c2300]">
                <button id="btn-mode-easy" onclick="setMode('easy')" class="flex-1 py-1 rounded-lg text-[11px] font-black text-slate-700">EASY 🐣</button>
                <button id="btn-mode-normal" onclick="setMode('normal')" class="flex-1 py-1 rounded-lg text-[11px] font-black text-slate-700">NORMAL ⚡</button>
                <button id="btn-mode-hard" onclick="setMode('hard')" class="flex-1 py-1 rounded-lg text-[11px] font-black text-slate-700">HARD 👴</button>
            </div>

            <div id="character-list" class="flex gap-2 overflow-x-auto pb-1"></div>
        </div>

        <!-- API Key Input -->
        <div id="api-bar" class="bg-amber-200 px-3 py-1.5 border-b-2 border-[#5c2300] flex items-center justify-between gap-2">
            <span class="text-[10px] font-extrabold text-black">🔑 OpenRouter Key:</span>
            <input type="password" id="in-chat-api-key" placeholder="Paste API Key..." class="flex-1 bg-white px-2 py-0.5 rounded-lg border-2 border-[#5c2300] text-xs font-bold text-black focus:outline-none">
        </div>

        <!-- Chat Feed -->
        <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-3 chat-bg relative">
            <!-- Messages render here -->
        </div>

        <!-- Guided Tutorial Tooltip -->
        <div id="tutorial-tooltip" class="hidden absolute bottom-20 left-4 right-4 bg-orange-500 text-white p-3 rounded-2xl border-4 border-[#5c2300] font-extrabold text-xs text-center shadow-lg z-30 animate-bounce">
            <span id="tutorial-text">Welcome to Tutorial!</span>
        </div>

        <!-- Typing Indicator -->
        <div id="typing" class="hidden px-4 py-1 text-xs text-purple-900 font-extrabold italic chat-bg flex items-center gap-2">
            <span>Thinking... 🤔</span>
        </div>

        <!-- Inputs -->
        <div class="p-3 bg-amber-300 border-t-4 border-[#5c2300] flex gap-2 items-center">
            <input type="text" id="user-input" placeholder="Type something nice..." class="flex-1 bg-white text-sm text-black font-bold px-3 py-2.5 rounded-2xl border-2 border-[#5c2300] focus:outline-none" onkeypress="if(event.key === 'Enter') sendMsg()">
            <button onclick="sendMsg()" id="send-btn" class="btn-cartoon-green px-4 py-2.5 text-sm font-black uppercase">
                SEND
            </button>
        </div>

        <!-- PAUSE MODAL -->
        <div id="pause-modal" class="hidden absolute inset-0 bg-black/80 border-4 border-[#5c2300] flex flex-col items-center justify-center p-6 text-center z-40">
            <h2 class="text-3xl font-black text-amber-300 mb-4 title-cartoon">PAUSED</h2>
            <div class="w-full max-w-xs space-y-3">
                <button onclick="resumeGame()" class="btn-cartoon-green w-full py-3 font-extrabold text-sm">RESUME</button>
                <button onclick="returnToMenu()" class="btn-cartoon-red w-full py-3 font-extrabold text-sm">QUIT TO MENU</button>
            </div>
        </div>

        <!-- GAME OVER / WIN MODAL -->
        <div id="modal-screen" class="hidden absolute inset-0 bg-amber-300/95 border-8 border-[#5c2300] flex flex-col items-center justify-center p-6 text-center z-50">
            <div id="modal-icon" class="text-6xl mb-2">🎉</div>
            <h2 id="modal-title" class="text-3xl font-black mb-2 text-black title-cartoon">TITLE</h2>
            <p id="modal-desc" class="text-sm font-bold text-black mb-6 max-w-xs">Description text...</p>
            <button id="modal-action-btn" onclick="returnToMenu()" class="btn-cartoon-green px-6 py-3 font-black text-sm">
                MAIN MENU
            </button>
        </div>

    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'send') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'win') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
                }
            } catch (e) {
                console.log(e);
            }
        }

        const gameData = {
            easy: [
                {
                    id: "ali",
                    name: "Ali (20)",
                    distress: 60,
                    avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Ali",
                    prompt: "You are Ali, 20. You failed your exams. Speak briefly in funny dramatic 1-2 sentences.",
                    initial: "I failed my exams... my life is cooked bro! 😭"
                }
            ],
            normal: [
                {
                    id: "zain",
                    name: "Zain (25)",
                    distress: 80,
                    avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Zain",
                    prompt: "You are Zain, 25. Got fired. Reply in short dramatic texts.",
                    initial: "Boss fired me today. Now I've got 0 rupees! 💸"
                }
            ],
            hard: [
                {
                    id: "rashid",
                    name: "Uncle Rashid (56)",
                    distress: 95,
                    avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Rashid",
                    prompt: "You are Rashid, 56. Lost pension to a scammer. Speak angrily.",
                    initial: "Don't preach to me kid! I got scammed on WhatsApp! 😤"
                }
            ]
        };

        let currentPersona = null;
        let currentDistress = 80;
        let chatHistory = [];
        let isGameOver = false;
        let isTutorialMode = false;

        function getCurrentTime() {
            return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function startGameFromMenu() {
            isTutorialMode = false;
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('mode-bar').classList.remove('hidden');
            document.getElementById('api-bar').classList.remove('hidden');
            document.getElementById('tutorial-tooltip').classList.add('hidden');
            setMode('easy');
        }

        /* TUTORIAL MODE FUNCTION */
        function startTutorial() {
            isTutorialMode = true;
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('mode-bar').classList.add('hidden');
            document.getElementById('api-bar').classList.add('hidden');

            const tutorialPersona = {
                name: "Demo Guy (5% Sad)",
                distress: 5,
                avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=DemoGuy",
                initial: "I'm feeling a little bit sad today..."
            };

            selectPersona(tutorialPersona);
            currentDistress = 5;
            updateMetersUI();

            const tooltip = document.getElementById('tutorial-tooltip');
            const tooltipText = document.getElementById('tutorial-text');
            const inputField = document.getElementById('user-input');
            const timerBox = document.getElementById('timer-box');

            tooltip.classList.remove('hidden');

            // Step 1: Timer Explanation
            tooltipText.innerText = "📌 STEP 1: Look at the top! You have a 5-Minute Timer to cheer them up!";
            timerBox.classList.add('tutorial-highlight');

            setTimeout(() => {
                timerBox.classList.remove('tutorial-highlight');
                // Step 2: Auto Type Message
                tooltipText.innerText = "💬 STEP 2: Type positive words to lower their sadness level!";
                
                const sampleText = "Hey bro, keep your head up! Everything will be fine 😊";
                let idx = 0;
                inputField.value = "";

                const typeInterval = setInterval(() => {
                    inputField.value += sampleText[idx];
                    idx++;
                    if (idx >= sampleText.length) {
                        clearInterval(typeInterval);
                        
                        // Step 3: Auto Send & Win
                        setTimeout(() => {
                            tooltipText.innerText = "🚀 STEP 3: Hitting SEND decreases the Sadness Bar!";
                            renderMessage(inputField.value, 'user', getCurrentTime());
                            playSound('send');
                            inputField.value = "";

                            setTimeout(() => {
                                currentDistress = 0;
                                updateMetersUI();
                                renderMessage("Thank you so much! You made my day! ❤️", 'persona', getCurrentTime());
                                playSound('win');

                                setTimeout(() => {
                                    tooltip.classList.add('hidden');
                                    triggerWin("Tutorial Complete! Now click Main Menu and press PLAY! 🚀");
                                }, 2000);
                            }, 1000);

                        }, 1200);
                    }
                }, 50);

            }, 3500);
        }

        function setMode(mode) {
            ['easy', 'normal', 'hard'].forEach(m => {
                const btn = document.getElementById(`btn-mode-${m}`);
                if (m === mode) {
                    btn.className = "flex-1 py-1 rounded-lg text-[11px] font-black bg-amber-400 text-black border-2 border-[#5c2300]";
                } else {
                    btn.className = "flex-1 py-1 rounded-lg text-[11px] font-black text-slate-700 hover:bg-white";
                }
            });

            const container = document.getElementById('character-list');
            container.innerHTML = '';

            gameData[mode].forEach((p) => {
                const btn = document.createElement('button');
                btn.onclick = () => selectPersona(p);
                btn.className = "flex-1 py-1.5 px-3 bg-white hover:bg-yellow-200 rounded-xl text-xs font-black border-2 border-[#5c2300] whitespace-nowrap";
                btn.innerText = p.name;
                container.appendChild(btn);
            });

            selectPersona(gameData[mode][0]);
        }

        function selectPersona(persona) {
            currentPersona = persona;
            currentDistress = persona.distress;
            isGameOver = false;

            document.getElementById('persona-name').innerText = persona.name;
            document.getElementById('header-avatar').src = persona.avatar;
            document.getElementById('modal-screen').classList.add('hidden');

            updateMetersUI();

            chatHistory = [
                { role: "system", content: `${persona.prompt}` },
                { role: "assistant", content: persona.initial }
            ];

            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '';
            renderMessage(persona.initial, 'persona', getCurrentTime());
        }

        function updateMetersUI() {
            document.getElementById('distress-bar').style.width = `${currentDistress}%`;
        }

        function renderMessage(text, sender, time) {
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const msg = document.createElement('
