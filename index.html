<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Crisis Support Simulator</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700;800;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
 font-family:Fredoka,cursive;
 user-select:none;
 background:#065f46;
 margin:0;
 padding:10px;
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center
}
button{cursor:pointer;touch-action:manipulation}
.cartoon{
 background:linear-gradient(#ffd000,#ff8800);
 border:4px solid #5c2300;
 box-shadow:inset 0 4px #ffeaa7,0 6px #3d1700;
 color:#fff;
 text-shadow:2px 2px #5c2300,-2px -2px #5c2300;
 border-radius:28px
}
.green{
 background:linear-gradient(#7cfc00,#32cd32);
 border:4px solid #145214;
 box-shadow:inset 0 4px #b3ffb3,0 6px #0e380e;
 color:#fff;
 border-radius:28px
}
.red{
 background:linear-gradient(#ff4d4d,#c00);
 border:4px solid #4a0000;
 box-shadow:inset 0 4px #ffb3b3,0 6px #300;
 color:#fff;
 border-radius:28px
}
.title{
 color:#fc0;
 text-shadow:3px 3px #5c2300,-3px -3px #5c2300
}
.chat{background:#fef08a}
.user{background:#3b82f6;color:white;border:3px solid #1d4ed8}
.persona{background:white;color:#1e293b;border:3px solid #000}
</style>
</head>

<body>

<!-- MENU -->
<div id="menu"
class="w-full max-w-md h-[680px] rounded-3xl border-8 border-[#5c2300] flex flex-col items-center justify-between p-6 text-center"
style="background:linear-gradient(#7dd3fc,#bae6fd 50%,#86efac 50%,#4ade80)">

<h1 class="title text-4xl font-black mt-12">
CRISIS<br>SUPPORT
</h1>

<div class="w-full max-w-xs space-y-3">
<button onclick="startGame()" class="cartoon w-full py-4 text-2xl font-black">
PLAY
</button>

<button onclick="tutorial()" class="cartoon w-full py-4 text-2xl font-black">
TUTORIAL
</button>

<button onclick="alert('Crisis Support Simulator v1.0\\nDesigned & Built by Jarrar 🔥')"
class="cartoon w-full py-4 text-2xl font-black">
CREDITS
</button>
</div>

<span class="text-xs font-black text-[#5c2300] bg-white px-3 py-1 rounded-full">
Made by Jarrar 🔥
</span>
</div>


<!-- GAME -->
<div id="game"
class="hidden relative w-full max-w-md h-[680px] bg-white rounded-3xl border-8 border-[#5c2300] overflow-hidden flex flex-col">

<header class="p-3 bg-amber-400 border-b-4 border-[#5c2300] flex justify-between">
<div class="flex items-center gap-2">
<button onclick="pause()" class="cartoon px-3 py-1 text-xs font-black">PAUSE</button>
<img id="avatar" class="w-10 h-10 rounded-full bg-white border-2 border-[#5c2300]">
<div>
<b id="name">Name</b>
<p class="text-[10px] font-bold">Online</p>
</div>
</div>

<div class="text-right">
<div class="text-xs font-black bg-[#5c2300] text-white px-2 rounded-full">
⏱️ <span id="timer">05:00</span>
</div>
<span class="text-[9px] font-black">Sadness 😭</span>
<div class="w-16 h-3 bg-gray-200 rounded-full border-2 border-[#5c2300]">
<div id="bar" class="bg-red-500 h-full w-full"></div>
</div>
</div>
</header>


<div id="modes" class="p-2 bg-amber-100 border-b-4 border-[#5c2300]">
<div class="flex gap-1">
<button onclick="mode('easy')" class="flex-1 p-1 font-black">EASY 🐣</button>
<button onclick="mode('normal')" class="flex-1 p-1 font-black">NORMAL ⚡</button>
<button onclick="mode('hard')" class="flex-1 p-1 font-black">HARD 👴</button>
</div>
<div id="chars" class="flex gap-2 mt-2"></div>
</div>


<div id="api" class="bg-amber-200 p-2 flex gap-2 items-center">
<b class="text-[10px]">🔑 API Key:</b>
<input id="key" type="password" placeholder="Paste API Key..."
class="flex-1 border-2 border-[#5c2300] rounded-lg px-2 text-xs">
</div>


<div id="chat" class="chat flex-1 p-4 overflow-y-auto space-y-3"></div>

<div id="typing" class="hidden chat px-4 py-1 text-xs font-bold">
Thinking... 🤔
</div>


<div class="p-3 bg-amber-300 border-t-4 border-[#5c2300] flex gap-2">
<input id="input" placeholder="Type something nice..."
class="flex-1 border-2 border-[#5c2300] rounded-2xl px-3 py-2 text-sm">

<button onclick="send()" class="green px-4 py-2 font-black">
SEND
</button>
</div>


<div id="pauseBox"
class="hidden absolute inset-0 bg-black/80 flex flex-col justify-center items-center gap-3 z-20">

<h2 class="title text-3xl font-black">PAUSED</h2>

<button onclick="resume()" class="green w-48 py-3 font-black">
RESUME
</button>

<button onclick="menu()" class="red w-48 py-3 font-black">
QUIT TO MENU
</button>
</div>


<div id="result"
class="hidden absolute inset-0 bg-amber-300/95 flex flex-col justify-center items-center p-6 text-center z-30">

<div id="icon" class="text-6xl">🎉</div>
<h2 id="resultTitle" class="title text-3xl font-black">YOU WON!</h2>
<p id="resultText" class="font-bold mb-5"></p>

<button onclick="menu()" class="green px-6 py-3 font-black">
MAIN MENU
</button>
</div>

</div>


<script>
const data={
easy:[{
name:"Ali (20)",distress:60,
avatar:"https://api.dicebear.com/7.x/bottts/svg?seed=Ali",
prompt:"You are Ali, 20. You failed your exams. Speak briefly in funny dramatic 1-2 sentences.",
initial:"I failed my exams... my life is cooked bro! 😭"
}],
normal:[{
name:"Zain (25)",distress:80,
avatar:"https://api.dicebear.com/7.x/bottts/svg?seed=Zain",
prompt:"You are Zain, 25. Got fired. Reply in short dramatic texts.",
initial:"Boss fired me today. Now I've got 0 rupees! 💸"
}],
hard:[{
name:"Uncle Rashid (56)",distress:95,
avatar:"https://api.dicebear.com/7.x/bottts/svg?seed=Rashid",
prompt:"You are Rashid, 56. Lost pension to a scammer. Speak angrily.",
initial:"Don't preach to me kid! I got scammed on WhatsApp! 😤"
}]
};

let persona,distress,history=[],over=false,time=300,interval;

const $=id=>document.getElementById(id);

function startGame(){
 $("menu").classList.add("hidden");
 $("game").classList.remove("hidden");
 $("modes").classList.remove("hidden");
 $("api").classList.remove("hidden");
 mode("easy");
 startTimer();
}

function mode(m){
 $("chars").innerHTML="";
 data[m].forEach(p=>{
  let b=document.createElement("button");
  b.className="bg-white border-2 border-[#5c2300] rounded-xl px-3 py-1 text-xs font-black";
  b.textContent=p.name;
  b.onclick=()=>select(p);
  $("chars").appendChild(b);
 });
 select(data[m][0]);
}

function select(p){
 persona=p;
 distress=p.distress;
 over=false;
 $("name").textContent=p.name;
 $("avatar").src=p.avatar;
 $("bar").style.width=distress+"%";
 $("chat").innerHTML="";
 history=[
  {role:"system",content:p.prompt},
  {role:"assistant",content:p.initial}
 ];
 message(p.initial,"persona");
}

function message(text,type){
 let d=document.createElement("div");
 d.className="flex "+(type==="user"?"justify-end":"justify-start");

 let m=document.createElement("div");
 m.className="max-w-[80%] rounded-2xl px-3 py-2 text-xs font-bold shadow "+(type==="user"?"user":"persona");
 m.innerHTML="<div>"+text+"</div><div class='text-[9px] text-gray-500 text-right'>"+
 new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+
 "</div>";

 d.appendChild(m);
 $("chat").appendChild(d);
 $("chat").scrollTop=$("chat").scrollHeight;
}

function startTimer(){
 clearInterval(interval);
 time=300;
 updateTimer();

 interval=setInterval(()=>{
  if(over)return;
  time--;
  updateTimer();

  if(time<=0){
   clearInterval(interval);
   lose("Time's Up! They felt unheard and left the chat.");
  }
 },1000);
}

function updateTimer(){
 $("timer").textContent=
 String(Math.floor(time/60)).padStart(2,"0")+":"+
 String(time%60).padStart(2,"0");
}

function send(){
 if(over)return;

 let text=$("input").value.trim();
 let key=$("key").value.trim();

 if(!text)return;

 if(!key){
  alert("Please paste your OpenRouter API Key!");
  return;
 }

 message(text,"user");
 $("input").value="";

 distress=Math.max(0,distress-25);
 $("bar").style.width=distress+"%";

 history.push({role:"user",content:text});
 $("typing").classList.remove("hidden");

 fetch("https://openrouter.ai/api/v1/chat/completions",{
  method:"POST",
  headers:{
   Authorization:"Bearer "+key,
   "Content-Type":"application/json"
  },
  body:JSON.stringify({
   model:"openrouter/auto",
   messages:history
  })
 })
 .then(r=>r.json())
 .then(d=>{
  $("typing").classList.add("hidden");

  let reply=d.choices?.[0]?.message?.content||
  "Hmm... I'm speechless right now.";

  history.push({role:"assistant",content:reply});
  message(reply,"persona");

  if(distress===0)
   win("Incredible Job! You successfully cheered them up! ❤️");
 })
 .catch(()=>{
  $("typing").classList.add("hidden");
  message("Error connecting to OpenRouter API.","persona");
 });
}

function win(t){
 over=true;
 clearInterval(interval);
 $("icon").textContent="🎉";
 $("resultTitle").textContent="YOU WON!";
 $("resultText").textContent=t;
 $("result").classList.remove("hidden");
}

function lose(t){
 over=true;
 clearInterval(interval);
 $("icon").textContent="💀";
 $("resultTitle").textContent="GAME OVER";
 $("resultText").textContent=t;
 $("result").classList.remove("hidden");
}

function pause(){
 $("pauseBox").classList.remove("hidden");
}

function resume(){
 $("pauseBox").classList.add("hidden");
}

function menu(){
 clearInterval(interval);
 $("game").classList.add("hidden");
 $("menu").classList.remove("hidden");
 $("pauseBox").classList.add("hidden");
 $("result").classList.add("hidden");
}

function tutorial(){
 startGame();
 $("modes").classList.add("hidden");
 $("api").classList.add("hidden");
 alert("Tutorial:\\n\\n1. You have 5 minutes.\\n2. Send supportive messages.\\n3. Lower the Sadness Bar to 0 to win!");
}

$("input").addEventListener("keydown",e=>{
 if(e.key==="Enter")send();
});
</script>

</body>
</html>
