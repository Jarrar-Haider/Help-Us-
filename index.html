        // Web Audio Synthesizer
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let ambientOsc = null;
        let ambientGain = null;

        function startAmbientSound() {
            if (ambientOsc) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            ambientOsc = audioCtx.createOscillator();
            ambientGain = audioCtx.createGain();
            
            ambientOsc.type = 'sine';
            ambientOsc.frequency.setValueAtTime(60, audioCtx.currentTime);
            ambientGain.gain.setValueAtTime(0.02, audioCtx.currentTime);

            ambientOsc.connect(ambientGain);
            ambientGain.connect(audioCtx.destination);
            ambientOsc.start();
        }

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'send') {
                osc.frequency.setValueAtTime(350, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'receive') {
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                osc.start(); osc.stop(audioCtx.currentTime + 0.12);
            } else if (type === 'lose') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.7);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.7);
                osc.start(); osc.stop(audioCtx.currentTime + 0.7);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            }
        }

        function startTimer() {
            if (timerStarted) return;
            timerStarted = true;
            timerInterval = setInterval(() => {
                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    triggerTimeOutLoss();
                    return;
                }
                timerSeconds--;
                updateTimerDisplay();
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerSeconds = 300;
            timerStarted = false;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
            const secs = (timerSeconds % 60).toString().padStart(2, '0');
            const display = document.getElementById('timer-display');
            display.innerText = `${mins}:${secs}`;
            if (timerSeconds <= 60) {
                display.className = "text-xs font-extrabold text-red-500 animate-pulse bg-gray-950 px-2 py-0.5 rounded border border-red-800 font-mono";

                display.className = "text-xs font-extrabold text-amber-400 bg-gray-950 px-2 py-0.5 rounded border border-gray-800 font-mono";

        }

            if (isGameOver) return;

            document.getElementById('pause-modal').classList.remove('hidden');
        }

                    }

                }, 1000);
